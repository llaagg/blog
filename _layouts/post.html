---
layout: default
---

<main class="container py-5">
  <div class="row g-5">
    <article class="col-lg-8">
      <p class="text-muted">{{ page.date | date: "%B %-d, %Y" }}</p>
      <h1>{{ page.title }}</h1>
      <hr class="my-4">
      {{ content }}
    </article>

    <aside class="col-lg-4">
      <div class="card">
        <div class="card-body">
          <h2 class="h5">About this post</h2>
          <p class="card-text">A note about tools, teamwork, and engineering.</p>
          <a href="{{ "/" | relative_url }}">Back to all posts</a>
        </div>
      </div>
    </aside>
  </div>
</main>
