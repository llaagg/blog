<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title }} | {{ site.title }}</title>
  <script>
    const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
    document.documentElement.setAttribute("data-bs-theme", colorScheme.matches ? "dark" : "light");
    colorScheme.addEventListener("change", event => {
      document.documentElement.setAttribute("data-bs-theme", event.matches ? "dark" : "light");
    });
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="siteNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ "/" | relative_url }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ "/workspace-01/Readme.md" | relative_url }}">Markdown source</a></li>
        </ul>
      </div>
    </div>
  </nav>

  {{ content }}

  <footer class="bg-body-tertiary border-top py-4">
    <div class="container">{{ site.title }} - Published on GitHub Pages</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrY0t3YlHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
